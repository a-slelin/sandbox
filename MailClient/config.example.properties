# Шаблон конфигурации MailClient.
# Скопируйте файл в config.properties (рядом с MailClient.jar) и укажите свои данные.
# config.properties добавлен в .gitignore — не коммитьте его.

# Сервер исходящей почты (STARTTLS)
smtp.host=smtp.yandex.ru
smtp.port=587

# Сервер входящей почты (SSL)
imap.host=imap.yandex.ru
imap.port=993

# Учётная запись: адрес и пароль приложения (не основной пароль от ящика)
email.user=your.name@yandex.ru
email.password=your-app-password
